# CareNova backend — Render Blueprint.
#
# This file must sit at the REPOSITORY ROOT: Render only reads `render.yaml`
# from the repo root, which is exactly why `rootDir: backend` below exists.
# (The previous backend/render.yaml was a CareDental-era leftover Render would
# never have picked up — it named a `caredental-api` service and predated the
# fork's Supabase/host env vars.)
#
# COLD START: on the free plan Render suspends the service after ~15 minutes
# of inactivity, and the next request pays a ~30-50 second wake-up. That is a
# live-demo hazard: the first login after an idle period looks like a hang.
# Upgrading this service to `starter` ($7/mo) removes the sleep entirely.
services:
  - type: web
    name: carenova-api
    runtime: node
    region: frankfurt        # Supabase project is eu-central-1 — keep them on one continent.
    plan: free
    rootDir: backend
    buildCommand: npm ci     # not `npm install`: reproducible, and package-lock.json is in sync.
    startCommand: node src/index.js
    healthCheckPath: /health # returns {"status":"ok","service":"carenova-backend"}
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is deliberately absent. Render injects it and the app already
      # reads `process.env.PORT || 3001`; pinning it here is the classic way
      # to make a Render service fail its health check.

      # ── Database ────────────────────────────────────────────────────────
      # Supabase's direct host (db.<ref>.supabase.co) publishes ONLY an AAAA
      # record. From an IPv4 network that resolves to ENOTFOUND, so this must
      # be the session pooler: aws-0-eu-central-1.pooler.supabase.com:5432
      - key: DATABASE_URL
        sync: false

      # ── Supabase (patient document storage) ─────────────────────────────
      - key: SUPABASE_URL
        sync: false
      # New-format `sb_secret_...` key — an opaque string, NOT a JWT. Entered
      # by hand in the Render dashboard; never committed, never logged.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Auth ────────────────────────────────────────────────────────────
      # Generated by Render rather than copied from local .env: production
      # should not share a signing secret with a developer laptop, and this
      # is two fewer secrets to hand-carry. Rotating them just logs everyone
      # out — no data is affected.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── CORS origins (see backend/src/index.js allowlist) ───────────────
      - key: APP_URL
        value: https://app.carenova.ai
      - key: ADMIN_URL
        value: https://admin.carenova.ai
      - key: FRONTEND_URL
        value: https://carenova.ai
      - key: LANDING_URL
        value: https://carenova.ai
      # Optional, and normally unset. Set it to ONE exact Vercel preview
      # origin while validating staging, then clear it. There is deliberately
      # no wildcard *.vercel.app match in production — see index.js.
      - key: PREVIEW_URL
        sync: false
